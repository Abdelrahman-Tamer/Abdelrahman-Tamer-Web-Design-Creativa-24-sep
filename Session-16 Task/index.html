<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <title>Document</title>
</head>

<body class="">


    <div id="div-id" class="bg-light py-3 w-100 d-flex align-items-center justify-content-center">
        <ul id="list-id" class="list-unstyled d-flex align-items-center justify-content-center gap-5">
            <li id="item" class="active">Home</li>
            <li id="item">About</li>
            <li id="item">Contact</li>
            <li id="item">Services</li>
        </ul>
    </div>

    <div class="d-flex align-items-center justify-content-center mt-5 container">
        <form id="form-id" class="w-50">
            <input class="form-control mb-3 w-100" type="text" placeholder="First Name" id="first-name">
            <input class="form-control mb-3 w-100" type="text" placeholder="Last Name" id="last-name">
            <button class="btn btn-primary" type="submit" id="submit-btn">Submit</button>
            <button class="btn btn-warning d-none" type="button" onclick="updateData()" id="update-btn">Update</button>
        </form>
    </div>
    <div class="mt-5 container">
        <table class="table table-active table-striped w-100 shadow-sm text-center table-active table-hover ">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="t-body-id">
            </tbody>
        </table>
    </div>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

</body>

</html>
